server:
  port: 8001

spring:
  application:
    name: msvc-usuarios
  datasource:
    url: ${USUARIOS_DB_URL:jdbc:mysql://localhost:3306/msvc_usuarios?createDatabaseIfNotExist=true}
    username: ${USUARIOS_DB_USER}
    password: ${USUARIOS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
      show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
